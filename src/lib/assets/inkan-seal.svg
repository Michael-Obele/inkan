<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="inkan-seal-title">
  <title id="inkan-seal-title">inkan seal</title>
  <!-- Perforation hint: dotted outer frame, like a postage edge. -->
  <rect x="1.5" y="1.5" width="97" height="97" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="0.1 4.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Outer solid frame. -->
  <rect x="7" y="7" width="86" height="86" fill="none" stroke="currentColor" stroke-width="5"/>
  <!-- Inner thin frame. -->
  <rect x="15" y="15" width="70" height="70" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <!-- Corner stops on the inner frame. -->
  <circle cx="15" cy="15" r="2" fill="currentColor"/>
  <circle cx="85" cy="15" r="2" fill="currentColor"/>
  <circle cx="15" cy="85" r="2" fill="currentColor"/>
  <circle cx="85" cy="85" r="2" fill="currentColor"/>
  <!-- Wordmark. -->
  <text x="51" y="45" text-anchor="middle" dominant-baseline="middle" font-family="var(--font-mono), ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="2" fill="currentColor">INKAN</text>
  <!-- Diamond rule. -->
  <line x1="27" y1="58" x2="42" y2="58" stroke="currentColor" stroke-width="1.25"/>
  <line x1="58" y1="58" x2="73" y2="58" stroke="currentColor" stroke-width="1.25"/>
  <rect x="47.2" y="55.2" width="5.6" height="5.6" transform="rotate(45 50 58)" fill="currentColor"/>
  <!-- Year. -->
  <text x="51" y="74" text-anchor="middle" dominant-baseline="middle" font-family="var(--font-mono), ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="currentColor">2026</text>
</svg>
